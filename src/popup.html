<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>网页视频下载器</title><link rel="stylesheet" href="style.css">
<body class="popup">
  <header>
    <h1>网页视频下载器</h1>
    <div class="toolbar-actions">
      <button id="refresh">重新扫描</button>
      <button id="settings">设置</button>
    </div>
  </header>
  <p id="state" role="status">正在读取当前网页…</p>
  <section id="media" aria-label="媒体资源"></section>
  <section id="download-jobs" aria-label="下载任务" hidden></section>
  <template id="job-template">
    <div class="job">
      <div class="media-title"></div>
      <div class="job-actions">
        <span class="job-message" role="status"></span>
        <button type="button" hidden>×</button>
      </div>
      <progress aria-label="下载进度" hidden></progress>
    </div>
  </template>
  <script type="module" src="popup.js"></script>
</body></html>
